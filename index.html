<!DOCTYPE html>
<html>

<head>

<title>Metal Sonic: Chronofix</title>

<link rel="icon" type="image/jpeg" href="icon.jpeg">

<style>

body {
    margin: 0;
    overflow: hidden;
    background: #55c9ff;
}

canvas {
    display: block;
}

#hud {

    position: absolute;
    top: 15px;
    left: 15px;

    color: white;
    font-family: Arial;
    font-size: 24px;

    text-shadow: 2px 2px black;
}

</style>

</head>


<body>


<div id="hud">

Metal Sonic: Chrono Fix<br>
Rings: <span id="rings">0</span>

</div>


<canvas id="game"></canvas>



<script>


const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");


canvas.width = window.innerWidth;
canvas.height = window.innerHeight;



// METAL SONIC SPRITES

const metalIdle = new Image();
metalIdle.src = "sprites/metal/idle.png";


const metalRun = new Image();
metalRun.src = "sprites/metal/run.png";


const metalJump = new Image();
metalJump.src = "sprites/metal/jump.png";




// PLAYER

let player = {

    x:200,
    y:300,

    width:40,
    height:70,

    vx:0,
    vy:0,

    speed:0.8,
    maxSpeed:8,

    jumpPower:-15,

    grounded:false
};



// CAMERA

let camera = {

    x:0

};



// LEVEL

let level = {

    width:5000,
    ground:450

};



// CONTROLS

let keys={};


document.addEventListener("keydown", e=>{

    keys[e.key]=true;

});


document.addEventListener("keyup", e=>{

    keys[e.key]=false;

});




// UPDATE

function update(){


    if(keys["ArrowRight"]){

        player.vx += player.speed;

    }


    if(keys["ArrowLeft"]){

        player.vx -= player.speed;

    }



    player.vx *= 0.85;



    if(player.vx > player.maxSpeed)
        player.vx = player.maxSpeed;


    if(player.vx < -player.maxSpeed)
        player.vx = -player.maxSpeed;



    if(keys[" "] && player.grounded){

        player.vy = player.jumpPower;

        player.grounded=false;

    }



    player.vy += 0.7;



    player.x += player.vx;
    player.y += player.vy;



    // GROUND

    if(player.y + player.height >= level.ground){

        player.y = level.ground - player.height;

        player.vy=0;

        player.grounded=true;

    }



    // DEATH

    if(player.y > canvas.height){

        player.x=200;
        player.y=200;

        player.vx=0;
        player.vy=0;

    }



    // CAMERA FOLLOW

    camera.x = player.x - 300;


    if(camera.x < 0)

        camera.x=0;

}





// DRAW

function draw(){


    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );



    // SKY

    ctx.fillStyle="#55c9ff";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );



    // GROUND

    ctx.fillStyle="#35b52a";

    ctx.fillRect(

        -camera.x,
        level.ground,
        level.width,
        canvas.height

    );




    // PICK SPRITE

    let sprite = metalIdle;



    if(!player.grounded){

        sprite = metalJump;

    }

    else if(Math.abs(player.vx)>1){

        sprite = metalRun;

    }




    // DRAW METAL SONIC

    let spriteWidth = sprite.width * 0.5;
    let spriteHeight = sprite.height * 0.5;



    ctx.drawImage(

        sprite,

        player.x-camera.x-(spriteWidth-player.width)/2,

        player.y-(spriteHeight-player.height),

        spriteWidth,

        spriteHeight

    );



}




// GAME LOOP

function gameLoop(){

    update();

    draw();

    requestAnimationFrame(gameLoop);

}



gameLoop();



</script>


</body>

</html>
