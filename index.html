```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Metal Sonic: Chrono Fix - Green Hill</title>

<style>
body{
    margin:0;
    overflow:hidden;
    background:black;
}

canvas{
    display:block;
    background:linear-gradient(#5cc8ff,#b6ecff);
}
</style>
</head>
<body>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const gravity = 0.8;

const player = {
    x:100,
    y:300,
    width:50,
    height:50,
    vx:0,
    vy:0,
    speed:0.7,
    maxSpeed:12,
    grounded:false
};

let cameraX = 0;

const keys = {};

document.addEventListener("keydown",e=>{
    keys[e.code] = true;

    if(e.code==="Space" && player.grounded){
        player.vy = -16;
        player.grounded = false;
    }
});

document.addEventListener("keyup",e=>{
    keys[e.code] = false;
});

const ground = [
    {x:0,y:500,w:800,h:200},
    {x:900,y:450,w:600,h:250},
    {x:1600,y:520,w:900,h:180},
    {x:2700,y:470,w:700,h:230}
];

const rings = [
    {x:400,y:350},
    {x:460,y:320},
    {x:520,y:350},
    {x:1200,y:280},
    {x:1260,y:250},
    {x:1320,y:280}
];

function drawBackground(){

    // mountains
    ctx.fillStyle = "#4db06d";

    for(let i=0;i<10;i++){
        ctx.beginPath();
        ctx.arc(i*500 - cameraX*0.3,450,300,Math.PI,0);
        ctx.fill();
    }

    // water
    ctx.fillStyle = "#2ca8ff";
    ctx.fillRect(0,canvas.height-120,canvas.width,120);
}

function drawGround(){

    ground.forEach(g=>{

        ctx.fillStyle = "#3cb043";
        ctx.fillRect(g.x-cameraX,g.y,g.w,g.h);

        // dirt
        ctx.fillStyle = "#9b5a2e";
        ctx.fillRect(g.x-cameraX,g.y+30,g.w,g.h-30);

        // checker pattern
        ctx.strokeStyle = "#7a431f";

        for(let x=0;x<g.w;x+=40){
            for(let y=30;y<g.h;y+=40){
                ctx.strokeRect(g.x-cameraX+x,g.y+y,40,40);
            }
        }
    });
}

function drawPalmTrees(){

    for(let i=0;i<8;i++){

        let x = i*700 + 300 - cameraX*0.9;

        ctx.fillStyle = "#8b4513";
        ctx.fillRect(x,320,20,180);

        ctx.fillStyle = "green";

        for(let j=0;j<5;j++){
            ctx.beginPath();
            ctx.arc(x+10,310,50,0,Math.PI*2);
            ctx.fill();
        }
    }
}

function drawRings(){

    rings.forEach(r=>{

        ctx.strokeStyle = "gold";
        ctx.lineWidth = 6;

        ctx.beginPath();
        ctx.arc(r.x-cameraX,r.y,15,0,Math.PI*2);
        ctx.stroke();
    });
}

function drawPlayer(){

    // body
    ctx.fillStyle = "#00d9ff";
    ctx.fillRect(player.x,player.y,player.width,player.height);

    // visor
    ctx.fillStyle = "red";
    ctx.fillRect(player.x+8,player.y+15,34,8);

    // jet glow
    ctx.fillStyle = "cyan";
    ctx.fillRect(player.x+18,player.y+48,14,10);
}

function physics(){

    // acceleration
    if(keys["ArrowRight"]){
        player.vx += player.speed;
    }
    else if(keys["ArrowLeft"]){
        player.vx -= player.speed;
    }
    else{
        player.vx *= 0.90;
    }

    // clamp speed
    if(player.vx > player.maxSpeed) player.vx = player.maxSpeed;
    if(player.vx < -player.maxSpeed) player.vx = -player.maxSpeed;

    player.x += player.vx;

    // gravity
    player.vy += gravity;
    player.y += player.vy;

    player.grounded = false;

    ground.forEach(g=>{

        if(
            player.x + player.width > g.x-cameraX &&
            player.x < g.x-cameraX + g.w &&
            player.y + player.height > g.y &&
            player.y + player.height < g.y + 40
        ){
            player.y = g.y - player.height;
            player.vy = 0;
            player.grounded = true;
        }
    });

    // camera follow
    cameraX += player.vx;

    if(cameraX < 0) cameraX = 0;
}

function drawHUD(){

    ctx.fillStyle = "white";
    ctx.font = "30px Arial";
    ctx.fillText("GREEN HILL - CHRONO FRACTURE",20,50);
}

function loop(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    drawBackground();
    drawGround();
    drawPalmTrees();
    drawRings();

    physics();
    drawPlayer();

    drawHUD();

    requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
