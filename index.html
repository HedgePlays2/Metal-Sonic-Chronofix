<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Metal Sonic: Chrono Fix</title>

<style>

body{
    margin:0;
    overflow:hidden;
    background:black;
    font-family:Arial;
}

canvas{
    display:block;
    width:100vw;
    height:100vh;
    background:linear-gradient(#5cc8ff,#d9f7ff);
    image-rendering: pixelated;
}

#hud{
    position:absolute;
    top:10px;
    left:15px;
    color:white;
    font-size:24px;
    text-shadow:2px 2px black;
    z-index:10;
}

</style>
</head>
<body>

<div id="hud">
    GREEN HILL — CHRONO FRACTURE<br>
    RINGS: <span id="rings">0</span>
</div>

<canvas id="game"></canvas>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

ctx.imageSmoothingEnabled = false;

let cameraX = 0;
let ringCount = 0;

const gravity = 0.8;



// IDLE SPRITE

const idleSprite = new Image();
idleSprite.src = "idle.png";




// PLAYER

const player = {

    x:100,
    y:300,

    width:96,
    height:96,

    vx:0,
    vy:0,

    speed:0.7,
    maxSpeed:14,

    grounded:false
};




// INPUT

const keys = {};

document.addEventListener("keydown", e=>{

    keys[e.code] = true;

    if(e.code === "Space" && player.grounded){

        player.vy = -18;
    }
});

document.addEventListener("keyup", e=>{

    keys[e.code] = false;
});




// FULL MAP

const ground = [

    // starting area
    {x:0,y:550,w:1200,h:300},

    // hill
    {x:1300,y:500,w:600,h:350},

    // dip
    {x:2100,y:620,w:500,h:230},

    // climb
    {x:2800,y:550,w:500,h:300},
    {x:3400,y:470,w:600,h:380},

    // platform route
    {x:4300,y:400,w:300,h:30},
    {x:4700,y:320,w:300,h:30},
    {x:5100,y:240,w:300,h:30},

    // lower route
    {x:4200,y:550,w:1800,h:300},

    // bridge area
    {x:6400,y:500,w:1200,h:350},

    // jump section
    {x:8000,y:450,w:250,h:30},
    {x:8400,y:350,w:250,h:30},
    {x:8800,y:250,w:250,h:30},

    // long runway
    {x:9400,y:550,w:2500,h:300},

    // boss arena
    {x:12200,y:550,w:1500,h:300}
];




// RINGS

const rings = [];

for(let i=300;i<13500;i+=140){

    rings.push({

        x:i,
        y:300 + Math.sin(i*0.01)*80,

        collected:false
    });
}




// SPRINGS

const springs = [

    {x:2400,y:570,w:40,h:40},
    {x:7200,y:450,w:40,h:40},
    {x:10000,y:500,w:40,h:40}
];




// ENEMIES

const enemies = [

    {x:1800,y:450,w:50,h:50,dir:1},
    {x:5000,y:500,w:50,h:50,dir:1},
    {x:9500,y:500,w:50,h:50,dir:1}
];




// BACKGROUND

function drawBackground(){

    // mountains
    ctx.fillStyle = "#4db06d";

    for(let i=0;i<40;i++){

        ctx.beginPath();

        ctx.arc(
            i*500 - cameraX*0.3,
            500,
            300,
            Math.PI,
            0
        );

        ctx.fill();
    }

    // water
    ctx.fillStyle = "#2ca8ff";

    ctx.fillRect(
        0,
        canvas.height-120,
        canvas.width,
        120
    );
}




// GROUND

function drawGround(){

    ground.forEach(g=>{

        // dirt
        ctx.fillStyle = "#9b5a2e";

        ctx.fillRect(
            g.x-cameraX,
            g.y,
            g.w,
            g.h
        );

        // grass
        ctx.fillStyle = "#3cb043";

        ctx.fillRect(
            g.x-cameraX,
            g.y,
            g.w,
            25
        );

        // checker pattern
        ctx.strokeStyle = "#7a431f";

        for(let x=0;x<g.w;x+=40){

            for(let y=25;y<g.h;y+=40){

                ctx.strokeRect(
                    g.x-cameraX+x,
                    g.y+y,
                    40,
                    40
                );
            }
        }
    });
}




// PALM TREES

function drawTrees(){

    for(let i=0;i<25;i++){

        let x = i*700 + 300 - cameraX*0.9;

        // trunk
        ctx.fillStyle = "#8b4513";

        ctx.fillRect(
            x,
            350,
            20,
            200
        );

        // leaves
        ctx.fillStyle = "green";

        ctx.beginPath();

        ctx.arc(
            x+10,
            340,
            50,
            0,
            Math.PI*2
        );

        ctx.fill();
    }
}




// PLAYER

function drawPlayer(){

    const screenX = player.x - cameraX;

    ctx.save();

    // flip sprite
    if(player.vx < 0){

        ctx.scale(-1,1);

        ctx.drawImage(

            idleSprite,

            -screenX - 96,
            player.y,

            96,
            96
        );
    }
    else{

        ctx.drawImage(

            idleSprite,

            screenX,
            player.y,

            96,
            96
        );
    }

    ctx.restore();
}




// RINGS

function drawRings(){

    rings.forEach(r=>{

        if(!r.collected){

            ctx.strokeStyle = "gold";
            ctx.lineWidth = 5;

            ctx.beginPath();

            ctx.arc(
                r.x-cameraX,
                r.y,
                15,
                0,
                Math.PI*2
            );

            ctx.stroke();
        }
    });
}



function collectRings(){

    rings.forEach(r=>{

        if(!r.collected){

            let dx = r.x - player.x;
            let dy = r.y - player.y;

            let dist = Math.sqrt(dx*dx + dy*dy);

            if(dist < 50){

                r.collected = true;

                ringCount++;

                document.getElementById("rings").innerText = ringCount;
            }
        }
    });
}




// SPRINGS

function drawSprings(){

    springs.forEach(s=>{

        ctx.fillStyle = "red";

        ctx.fillRect(
            s.x-cameraX,
            s.y,
            s.w,
            s.h
        );

        if(

            player.x < s.x + s.w &&
            player.x + player.width > s.x &&

            player.y < s.y + s.h &&
            player.y + player.height > s.y
        ){

            player.vy = -28;
        }
    });
}




// ENEMIES

function drawEnemies(){

    enemies.forEach(e=>{

        ctx.fillStyle = "purple";

        ctx.fillRect(
            e.x-cameraX,
            e.y,
            e.w,
            e.h
        );

        e.x += e.dir * 2;

        if(Math.random() < 0.01){

            e.dir *= -1;
        }

        if(

            player.x < e.x + e.w &&
            player.x + player.width > e.x &&

            player.y < e.y + e.h &&
            player.y + player.height > e.y
        ){

            respawn();
        }
    });
}




// RESPAWN

function respawn(){

    player.x = 100;
    player.y = 300;

    player.vx = 0;
    player.vy = 0;

    cameraX = 0;
}




// PHYSICS

function physics(){

    // movement
    if(keys["ArrowRight"]){

        player.vx += player.speed;
    }
    else if(keys["ArrowLeft"]){

        player.vx -= player.speed;
    }
    else{

        player.vx *= 0.90;
    }

    // speed limit
    if(player.vx > player.maxSpeed){
        player.vx = player.maxSpeed;
    }

    if(player.vx < -player.maxSpeed){
        player.vx = -player.maxSpeed;
    }

    player.x += player.vx;

    // gravity
    player.vy += gravity;
    player.y += player.vy;

    player.grounded = false;

    // collisions
    ground.forEach(g=>{

        if(

            player.x + player.width > g.x &&
            player.x < g.x + g.w &&

            player.y + player.height > g.y &&
            player.y + player.height < g.y + 60
        ){

            player.y = g.y - player.height;

            player.vy = 0;

            player.grounded = true;
        }
    });

    // camera
    let targetCamera =
        player.x - canvas.width/2;

    cameraX +=
        (targetCamera - cameraX) * 0.1;

    if(cameraX < 0){
        cameraX = 0;
    }

    // death
    if(player.y > canvas.height + 400){

        respawn();
    }
}




// GAME LOOP

function loop(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    drawBackground();

    drawGround();

    drawTrees();

    drawRings();

    collectRings();

    drawSprings();

    drawEnemies();

    physics();

    drawPlayer();

    requestAnimationFrame(loop);
}

loop();

</script>

</body>
</html>
