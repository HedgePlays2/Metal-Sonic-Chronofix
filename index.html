<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Metal Sonic: Chrono Fix</title>

<style>

body{
    margin:0;
    overflow:hidden;
    background:black;
    font-family:Arial;
}

canvas{
    display:block;
    background:linear-gradient(#5cc8ff,#d9f7ff);
}

#hud{
    position:absolute;
    top:10px;
    left:15px;
    color:white;
    font-size:24px;
    text-shadow:2px 2px black;
    z-index:10;
}

</style>
</head>
<body>

<div id="hud">
    GREEN HILL — CHRONO FRACTURE<br>
    RINGS: <span id="rings">0</span>
</div>

<canvas id="game"></canvas>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const gravity = 0.8;

let cameraX = 0;
let ringCount = 0;



// LOAD SPRITE SHEET

const metalSprite = new Image();
metalSprite.src = "metalsonic.png";



// PLAYER

const player = {

    x:100,
    y:200,

    width:70,
    height:70,

    vx:0,
    vy:0,

    speed:0.7,
    maxSpeed:14,

    grounded:false
};



const keys = {};

document.addEventListener("keydown", e=>{

    keys[e.code] = true;

    if(e.code === "Space" && player.grounded){

        player.vy = -16;
        player.grounded = false;
    }
});

document.addEventListener("keyup", e=>{

    keys[e.code] = false;
});




// FULL LEVEL

const ground = [

    // giant floor
    {x:0,y:550,w:1500,h:300},

    // raised hill
    {x:1600,y:500,w:600,h:350},

    // dip
    {x:2300,y:620,w:400,h:230},

    // climb
    {x:2800,y:540,w:500,h:310},
    {x:3400,y:470,w:500,h:380},
    {x:4000,y:400,w:600,h:450},

    // upper route
    {x:4800,y:300,w:300,h:30},
    {x:5200,y:240,w:300,h:30},
    {x:5600,y:180,w:300,h:30},

    // lower route
    {x:4700,y:550,w:1700,h:300},

    // bridge
    {x:6600,y:500,w:900,h:350},

    // platform section
    {x:7800,y:420,w:220,h:30},
    {x:8150,y:340,w:220,h:30},
    {x:8500,y:260,w:220,h:30},
    {x:8850,y:340,w:220,h:30},

    // long runway
    {x:9300,y:550,w:2400,h:300},

    // final climb
    {x:11900,y:500,w:500,h:350},
    {x:12500,y:420,w:500,h:430},
    {x:13100,y:330,w:700,h:520},

    // boss arena
    {x:14000,y:550,w:1800,h:300},
];




// RINGS

const rings = [];

for(let i=300;i<15500;i+=120){

    rings.push({

        x:i,
        y:320 + Math.sin(i*0.01)*70,

        collected:false
    });
}




// ENEMIES

const enemies = [

    {x:1800,y:450,w:40,h:40,dir:1},
    {x:3500,y:420,w:40,h:40,dir:1},
    {x:5200,y:500,w:40,h:40,dir:1},
    {x:7200,y:450,w:40,h:40,dir:1},
    {x:9800,y:500,w:40,h:40,dir:1},
];




// SPRINGS

const springs = [

    {x:2100,y:450,w:40,h:40},
    {x:6200,y:500,w:40,h:40},
    {x:9100,y:500,w:40,h:40},
];




// CHECKPOINT

let checkpoint = {

    x:100,
    y:200
};




// BACKGROUND

function drawBackground(){

    // mountains
    ctx.fillStyle = "#4db06d";

    for(let i=0;i<40;i++){

        ctx.beginPath();

        ctx.arc(
            i*500 - cameraX*0.3,
            500,
            300,
            Math.PI,
            0
        );

        ctx.fill();
    }

    // water
    ctx.fillStyle = "#2ca8ff";

    ctx.fillRect(
        0,
        canvas.height-120,
        canvas.width,
        120
    );
}




// GROUND

function drawGround(){

    ground.forEach(g=>{

        // dirt base
        ctx.fillStyle = "#9b5a2e";

        ctx.fillRect(
            g.x-cameraX,
            g.y,
            g.w,
            g.h
        );

        // grass top
        ctx.fillStyle = "#3cb043";

        ctx.fillRect(
            g.x-cameraX,
            g.y,
            g.w,
            25
        );

        // checker pattern
        ctx.strokeStyle = "#7a431f";
        ctx.lineWidth = 2;

        for(let x=0;x<g.w;x+=40){

            for(let y=25;y<g.h;y+=40){

                ctx.strokeRect(
                    g.x-cameraX+x,
                    g.y+y,
                    40,
                    40
                );
            }
        }
    });
}




// TREES

function drawPalmTrees(){

    for(let i=0;i<25;i++){

        let x = i*700 + 300 - cameraX*0.9;

        // trunk
        ctx.fillStyle = "#8b4513";

        ctx.fillRect(
            x,
            350,
            20,
            200
        );

        // leaves
        ctx.fillStyle = "green";

        for(let j=0;j<5;j++){

            ctx.beginPath();

            ctx.arc(
                x+10,
                340,
                50,
                0,
                Math.PI*2
            );

            ctx.fill();
        }
    }
}




// PLAYER SPRITES

let animFrame = 0;
let animTimer = 0;

function drawPlayer(){

    const screenX = player.x - cameraX;

    animTimer++;

    if(animTimer > 8){

        animFrame++;
        animTimer = 0;
    }

    // running animation
    if(Math.abs(player.vx) > 1){

        if(animFrame > 5){
            animFrame = 0;
        }

        ctx.drawImage(

            metalSprite,

            animFrame * 45,
            155,

            45,
            45,

            screenX,
            player.y,

            90,
            90
        );
    }

    // idle
    else{

        ctx.drawImage(

            metalSprite,

            0,
            55,

            45,
            45,

            screenX,
            player.y,

            90,
            90
        );
    }
}




// RINGS

function drawRings(){

    rings.forEach(r=>{

        if(!r.collected){

            ctx.strokeStyle = "gold";
            ctx.lineWidth = 5;

            ctx.beginPath();

            ctx.arc(
                r.x-cameraX,
                r.y,
                15,
                0,
                Math.PI*2
            );

            ctx.stroke();
        }
    });
}



function collectRings(){

    rings.forEach(r=>{

        if(!r.collected){

            let dx = r.x - player.x;
            let dy = r.y - (player.y+25);

            let dist = Math.sqrt(dx*dx + dy*dy);

            if(dist < 40){

                r.collected = true;

                ringCount++;

                document.getElementById("rings").innerText = ringCount;
            }
        }
    });
}




// ENEMIES

function drawEnemies(){

    enemies.forEach(e=>{

        ctx.fillStyle = "purple";

        ctx.fillRect(
            e.x-cameraX,
            e.y,
            e.w,
            e.h
        );

        e.x += e.dir * 2;

        if(Math.random() < 0.01){

            e.dir *= -1;
        }

        if(

            player.x < e.x + e.w &&
            player.x + player.width > e.x &&

            player.y < e.y + e.h &&
            player.y + player.height > e.y
        ){
            respawn();
        }
    });
}




// SPRINGS

function drawSprings(){

    springs.forEach(s=>{

        ctx.fillStyle = "red";

        ctx.fillRect(
            s.x-cameraX,
            s.y,
            s.w,
            s.h
        );

        if(

            player.x < s.x + s.w &&
            player.x + player.width > s.x &&

            player.y < s.y + s.h &&
            player.y + player.height > s.y
        ){
            player.vy = -25;
        }
    });
}




// CHECKPOINT

function drawCheckpoint(){

    ctx.fillStyle = "yellow";

    ctx.fillRect(
        14500-cameraX,
        300,
        20,
        120
    );

    if(

        player.x < 14520 &&
        player.x + player.width > 14500 &&

        player.y < 420 &&
        player.y + player.height > 300
    ){

        checkpoint.x = 14500;
        checkpoint.y = 200;
    }
}




// RESPAWN

function respawn(){

    player.x = checkpoint.x;
    player.y = checkpoint.y;

    player.vx = 0;
    player.vy = 0;
}




// PHYSICS

function physics(){

    // movement
    if(keys["ArrowRight"]){

        player.vx += player.speed;
    }
    else if(keys["ArrowLeft"]){

        player.vx -= player.speed;
    }
    else{

        player.vx *= 0.90;
    }


    // speed clamp
    if(player.vx > player.maxSpeed){
        player.vx = player.maxSpeed;
    }

    if(player.vx < -player.maxSpeed){
        player.vx = -player.maxSpeed;
    }


    // movement
    player.x += player.vx;


    // gravity
    player.vy += gravity;
    player.y += player.vy;

    player.grounded = false;


    // collision FIX
    ground.forEach(g=>{

        if(

            player.x + player.width > g.x &&
            player.x < g.x + g.w &&

            player.y + player.height > g.y &&
            player.y + player.height < g.y + 60
        ){

            player.y = g.y - player.height;

            player.vy = 0;

            player.grounded = true;
        }
    });


    // CAMERA

    let targetCamera =
        player.x - canvas.width / 2;

    cameraX +=
        (targetCamera - cameraX) * 0.08;

    if(cameraX < 0){
        cameraX = 0;
    }


    // death boundary
    if(player.y > canvas.height + 300){

        respawn();
    }
}




// LOOP

function loop(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    drawBackground();

    drawGround();

    drawPalmTrees();

    drawRings();
    collectRings();

    drawEnemies();

    drawSprings();

    drawCheckpoint();

    physics();

    drawPlayer();

    requestAnimationFrame(loop);
}

loop();

</script>

</body>
</html>
