<!DOCTYPE html>
<html>
<head>
<title>Metal Sonic: Chrono Fix</title>

<style>

body{
    margin:0;
    overflow:hidden;
    background:black;
}

canvas{
    display:block;
    background:#6ec6ff;
    image-rendering:pixelated;
}

#hud{
    position:absolute;
    top:10px;
    left:10px;
    color:white;
    font-size:32px;
    font-family:Arial;
    text-shadow:3px 3px black;
    z-index:5;
}

#titleScreen{

    position:absolute;

    width:100%;
    height:100%;

    background:
    linear-gradient(
        to bottom,
        #001122,
        #003366,
        #0066aa
    );

    display:flex;

    flex-direction:column;

    justify-content:center;
    align-items:center;

    z-index:10;
}

#gameTitle{

    color:#7ee7ff;

    font-size:80px;

    0 0 10px cyan,

    color:white;

    margin-top:60px;

    color:yellow;

    font-size:36px;

    animation:blink 1s infinite;

    text-shadow:2px 2px black;

    0%{opacity:1;}

<body>

<!-- TITLE SCREEN -->

<div id="titleScreen">

    <div id="gameTitle">
        METAL SONIC<br>
        CHRONO FIX
    </div>

    <div id="subtitle">
        A Sonic Fangame
    </div>

    <div id="startText">
        PRESS SPACE
    </div>

</div>



<!-- HUD -->

<div id="hud">
GREEN HILL — CHRONO FRACTURE<br>
RINGS: <span id="rings">0</span>
</div>



<!-- GAME -->

<canvas id="game"></canvas>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

ctx.imageSmoothingEnabled = false;



// =====================
// TITLE SCREEN
// =====================

let gameStarted = false;

document.addEventListener("keydown", e=>{

    keys[e.code] = true;

    // START GAME
    if(e.code === "Space" && !gameStarted){

        gameStarted = true;

        document
        .getElementById("titleScreen")
        .style.display = "none";
    }

    // JUMP
    else if(e.code === "Space" && player.grounded){

        player.vy = -18;
    }
});

document.addEventListener("keyup", e=>{

    keys[e.code] = false;
});




// =====================
// SPRITES
// =====================

const idleSprite = new Image();
idleSprite.src = "idle.png";

const springSprite = new Image();
springSprite.src = "spring.png";




// =====================
// CAMERA
// =====================

let cameraX = 0;




// =====================
// RINGS
// =====================

let rings = 0;




// =====================
// PHYSICS
// =====================

const gravity = 0.8;




// =====================
// PLAYER
// =====================

const player = {

    x:100,
    y:300,

    width:64,
    height:96,

    vx:0,
    vy:0,

    grounded:false
};




// =====================
// INPUT
// =====================

const keys = {};




// =====================
// LEVEL
// =====================

const level = [

    {x:0,y:550,w:1800,h:300},

    {x:2100,y:500,w:700,h:350},

    {x:3200,y:450,w:600,h:400},

    {x:4300,y:550,w:1800,h:300},

    {x:6700,y:450,w:500,h:30},

    {x:7400,y:350,w:500,h:30},

    {x:8200,y:550,w:2500,h:300},

    {x:11100,y:450,w:600,h:30},

    {x:12000,y:550,w:1600,h:300}
];




// =====================
// SPRINGS
// =====================

const springs = [

    {x:1800,y:486,w:64,h:64},

    {x:5200,y:486,w:64,h:64},

    {x:7600,y:286,w:64,h:64}
];




// =====================
// RINGS
// =====================

const ringList = [];

for(let i=300;i<13000;i+=150){

    ringList.push({

        x:i,
        y:350 + Math.sin(i*0.01)*80,

        collected:false
    });
}




// =====================
// BACKGROUND
// =====================

function drawBackground(){

    ctx.fillStyle = "#6ec6ff";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    // mountains
    ctx.fillStyle = "#4caf50";

    for(let i=0;i<30;i++){

        ctx.beginPath();

        ctx.arc(

            i*500 - cameraX*0.3,
            500,

            300,

            Math.PI,
            0
        );

        ctx.fill();
    }

    // water
    ctx.fillStyle = "#2b9cff";

    ctx.fillRect(
        0,
        canvas.height-120,
        canvas.width,
        120
    );
}




// =====================
// GROUND
// =====================

function drawGround(){

    level.forEach(g=>{

        // dirt
        ctx.fillStyle = "#9b5a2e";

        ctx.fillRect(

            g.x-cameraX,
            g.y,

            g.w,
            g.h
        );

        // grass
        ctx.fillStyle = "#3bc93b";

        ctx.fillRect(

            g.x-cameraX,
            g.y,

            g.w,
            25
        );

        // checker pattern
        ctx.strokeStyle = "#7a431f";

        for(let x=0;x<g.w;x+=40){

            for(let y=25;y<g.h;y+=40){

                ctx.strokeRect(

                    g.x-cameraX+x,
                    g.y+y,

                    40,
                    40
                );
            }
        }
    });
}




// =====================
// SPRINGS
// =====================

function drawSprings(){

    springs.forEach(s=>{

        ctx.drawImage(

            springSprite,

            s.x-cameraX,
            s.y,

            s.w,
            s.h
        );

        // bounce
        if(

            player.x + player.width > s.x &&
            player.x < s.x + s.w &&

            player.y + player.height > s.y &&
            player.y < s.y + s.h
        ){

            player.vy = -30;
        }
    });
}




// =====================
// PLAYER
// =====================

function drawPlayer(){

    const screenX = player.x - cameraX;

    ctx.save();

    if(player.vx < 0){

        ctx.scale(-1,1);

        ctx.drawImage(

            idleSprite,

            -screenX - 64,
            player.y,

            64,
            96
        );
    }
    else{

        ctx.drawImage(

            idleSprite,

            screenX,
            player.y,

            64,
            96
        );
    }

    ctx.restore();
}




// =====================
// RINGS
// =====================

function drawRings(){

    ringList.forEach(r=>{

        if(!r.collected){

            ctx.strokeStyle = "gold";
            ctx.lineWidth = 5;

            ctx.beginPath();

            ctx.arc(

                r.x-cameraX,
                r.y,

                15,

                0,
                Math.PI*2
            );

            ctx.stroke();
        }
    });
}




// =====================
// COLLECT RINGS
// =====================

function collectRings(){

    ringList.forEach(r=>{

        if(!r.collected){

            let dx = r.x - player.x;
            let dy = r.y - player.y;

            let dist = Math.sqrt(dx*dx + dy*dy);

            if(dist < 60){

                r.collected = true;

                rings++;

                document
                .getElementById("rings")
                .innerText = rings;
            }
        }
    });
}




// =====================
// PHYSICS
// =====================

function physics(){

    // movement
    if(keys["ArrowRight"]){

        player.vx += 0.7;
    }
    else if(keys["ArrowLeft"]){

        player.vx -= 0.7;
    }
    else{

        player.vx *= 0.90;
    }

    // speed cap
    if(player.vx > 14){
        player.vx = 14;
    }

    if(player.vx < -14){
        player.vx = -14;
    }

    player.x += player.vx;

    // gravity
    player.vy += gravity;

    player.y += player.vy;

    player.grounded = false;

    // collisions
    level.forEach(g=>{

        if(

            player.x + player.width > g.x &&
            player.x < g.x + g.w &&

            player.y + player.height > g.y &&
            player.y + player.height < g.y + 60
        ){

            player.y = g.y - player.height;

            player.vy = 0;

            player.grounded = true;
        }
    });

    // camera
    let targetCamera =

        player.x - canvas.width/2;

    cameraX +=

        (targetCamera-cameraX)*0.1;

    if(cameraX < 0){
        cameraX = 0;
    }

    // death
    if(player.y > canvas.height + 500){

        player.x = 100;
        player.y = 300;

        player.vx = 0;
        player.vy = 0;

        cameraX = 0;
    }
}




// =====================
// GAME LOOP
// =====================

function loop(){

    if(gameStarted){

        drawBackground();

        drawGround();

        drawRings();

        drawSprings();

        collectRings();

        physics();

        drawPlayer();
    }

    requestAnimationFrame(loop);
}

loop();

</script>

</body>
</html>
