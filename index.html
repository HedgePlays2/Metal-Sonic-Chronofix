<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Metal Sonic: Chrono Fix</title>

<style>

body{
    margin:0;
    overflow:hidden;
    background:black;
    font-family:Arial;
}

canvas{
    display:block;
    width:100vw;
    height:100vh;
    background:linear-gradient(#5cc8ff,#d9f7ff);
    image-rendering: pixelated;
}

#hud{
    position:absolute;
    top:10px;
    left:15px;
    color:white;
    font-size:24px;
    text-shadow:2px 2px black;
    z-index:10;
}

</style>
</head>
<body>

<div id="hud">
    GREEN HILL — CHRONO FRACTURE<br>
    RINGS: <span id="rings">0</span>
</div>

<canvas id="game"></canvas>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

ctx.imageSmoothingEnabled = false;

const gravity = 0.8;

let cameraX = 0;
let ringCount = 0;



// SPRITE SHEET

const metalSprite = new Image();
metalSprite.src = "metalsonic.png";



// PLAYER

const player = {

    x:100,
    y:300,

    width:72,
    height:72,

    vx:0,
    vy:0,

    speed:0.7,
    maxSpeed:14,

    grounded:false
};



// INPUT

const keys = {};

document.addEventListener("keydown", e=>{

    keys[e.code] = true;

    if(e.code === "Space" && player.grounded){

        player.vy = -18;
    }
});

document.addEventListener("keyup", e=>{

    keys[e.code] = false;
});




// LEVEL

const ground = [

    {x:0,y:550,w:1800,h:300},

    {x:1900,y:500,w:600,h:350},

    {x:2700,y:620,w:500,h:230},

    {x:3300,y:540,w:600,h:310},

    {x:4000,y:450,w:700,h:400},

    // platforms
    {x:5200,y:350,w:250,h:30},
    {x:5600,y:270,w:250,h:30},
    {x:6000,y:190,w:250,h:30},

    // lower path
    {x:5000,y:550,w:1800,h:300},

    // bridge
    {x:7200,y:500,w:1200,h:350},

    // platform section
    {x:9000,y:420,w:240,h:30},
    {x:9400,y:340,w:240,h:30},
    {x:9800,y:260,w:240,h:30},
    {x:10200,y:340,w:240,h:30},

    // speed runway
    {x:10700,y:550,w:2500,h:300},

    // boss arena
    {x:13500,y:550,w:2000,h:300},
];




// RINGS

const rings = [];

for(let i=300;i<15000;i+=140){

    rings.push({

        x:i,
        y:300 + Math.sin(i*0.01)*90,

        collected:false
    });
}




// ENEMIES

const enemies = [

    {x:2500,y:440,w:50,h:50,dir:1},
    {x:6200,y:500,w:50,h:50,dir:1},
    {x:11300,y:500,w:50,h:50,dir:1},
];




// SPRINGS

const springs = [

    {x:3000,y:500,w:40,h:40},
    {x:8500,y:500,w:40,h:40},
];




// BACKGROUND

function drawBackground(){

    // mountains
    ctx.fillStyle = "#4db06d";

    for(let i=0;i<40;i++){

        ctx.beginPath();

        ctx.arc(
            i*500 - cameraX*0.3,
            500,
            300,
            Math.PI,
            0
        );

        ctx.fill();
    }

    // water
    ctx.fillStyle = "#2ca8ff";

    ctx.fillRect(
        0,
        canvas.height-120,
        canvas.width,
        120
    );
}




// GROUND

function drawGround(){

    ground.forEach(g=>{

        // dirt
        ctx.fillStyle = "#9b5a2e";

        ctx.fillRect(
            g.x-cameraX,
            g.y,
            g.w,
            g.h
        );

        // grass
        ctx.fillStyle = "#3cb043";

        ctx.fillRect(
            g.x-cameraX,
            g.y,
            g.w,
            25
        );

        // checker pattern
        ctx.strokeStyle = "#7a431f";

        for(let x=0;x<g.w;x+=40){

            for(let y=25;y<g.h;y+=40){

                ctx.strokeRect(
                    g.x-cameraX+x,
                    g.y+y,
                    40,
                    40
                );
            }
        }
    });
}




// TREES

function drawTrees(){

    for(let i=0;i<25;i++){

        let x = i*700 + 300 - cameraX*0.9;

        // trunk
        ctx.fillStyle = "#8b4513";

        ctx.fillRect(
            x,
            350,
            20,
            200
        );

        // leaves
        ctx.fillStyle = "green";

        ctx.beginPath();

        ctx.arc(
            x+10,
            340,
            50,
            0,
            Math.PI*2
        );

        ctx.fill();
    }
}




// PLAYER SPRITES

let animFrame = 0;
let animTimer = 0;

function drawPlayer(){

    const screenX = player.x - cameraX;

    animTimer++;

    if(animTimer > 6){

        animFrame++;
        animTimer = 0;
    }

    // RUN
    if(Math.abs(player.vx) > 1){

        if(animFrame > 5){
            animFrame = 0;
        }

        ctx.drawImage(

            metalSprite,

            // sprite source
            10 + animFrame * 36,
            160,

            36,
            36,

            // draw position
            screenX,
            player.y,

            72,
            72
        );
    }

    // IDLE
    else{

        ctx.drawImage(

            metalSprite,

            5,
            78,

            36,
            36,

            screenX,
            player.y,

            72,
            72
        );
    }
}




// RINGS

function drawRings(){

    rings.forEach(r=>{

        if(!r.collected){

            ctx.strokeStyle = "gold";
            ctx.lineWidth = 5;

            ctx.beginPath();

            ctx.arc(
                r.x-cameraX,
                r.y,
                15,
                0,
                Math.PI*2
            );

            ctx.stroke();
        }
    });
}



function collectRings(){

    rings.forEach(r=>{

        if(!r.collected){

            let dx = r.x - player.x;
            let dy = r.y - player.y;

            let dist = Math.sqrt(dx*dx + dy*dy);

            if(dist < 50){

                r.collected = true;

                ringCount++;

                document.getElementById("rings").innerText = ringCount;
            }
        }
    });
}




// ENEMIES

function drawEnemies(){

    enemies.forEach(e=>{

        ctx.fillStyle = "purple";

        ctx.fillRect(
            e.x-cameraX,
            e.y,
            e.w,
            e.h
        );

        e.x += e.dir * 2;

        if(Math.random() < 0.01){

            e.dir *= -1;
        }

        if(

            player.x < e.x + e.w &&
            player.x + player.width > e.x &&

            player.y < e.y + e.h &&
            player.y + player.height > e.y
        ){

            player.x = 100;
            player.y = 300;

            cameraX = 0;
        }
    });
}




// SPRINGS

function drawSprings(){

    springs.forEach(s=>{

        ctx.fillStyle = "red";

        ctx.fillRect(
            s.x-cameraX,
            s.y,
            s.w,
            s.h
        );

        if(

            player.x < s.x + s.w &&
            player.x + player.width > s.x &&

            player.y < s.y + s.h &&
            player.y + player.height > s.y
        ){

            player.vy = -28;
        }
    });
}




// PHYSICS

function physics(){

    // move
    if(keys["ArrowRight"]){

        player.vx += player.speed;
    }
    else if(keys["ArrowLeft"]){

        player.vx -= player.speed;
    }
    else{

        player.vx *= 0.90;
    }

    // clamp
    if(player.vx > player.maxSpeed){
        player.vx = player.maxSpeed;
    }

    if(player.vx < -player.maxSpeed){
        player.vx = -player.maxSpeed;
    }

    player.x += player.vx;

    // gravity
    player.vy += gravity;
    player.y += player.vy;

    player.grounded = false;

    // collision
    ground.forEach(g=>{

        if(

            player.x + player.width > g.x &&
            player.x < g.x + g.w &&

            player.y + player.height > g.y &&
            player.y + player.height < g.y + 60
        ){

            player.y = g.y - player.height;

            player.vy = 0;

            player.grounded = true;
        }
    });

    // CAMERA FIX
    let targetCamera =
        player.x - canvas.width / 2;

    cameraX +=
        (targetCamera - cameraX) * 0.1;

    if(cameraX < 0){
        cameraX = 0;
    }

    // death
    if(player.y > canvas.height + 400){

        player.x = 100;
        player.y = 300;

        cameraX = 0;
    }
}




// LOOP

function loop(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    drawBackground();

    drawGround();

    drawTrees();

    drawRings();

    collectRings();

    drawEnemies();

    drawSprings();

    physics();

    drawPlayer();

    requestAnimationFrame(loop);
}

loop();

</script>

</body>
</html>
