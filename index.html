<!DOCTYPE html>
<html>
<head>
<title>Metal Sonic: Chrono Fix</title>

<style>

body{
    margin:0;
    overflow:hidden;
    background:black;
}

canvas{
    display:block;
    background:#6ec6ff;
    image-rendering:pixelated;
}

#hud{
    position:absolute;
    top:10px;
    left:10px;
    color:white;
    font-size:32px;
    font-family:Arial;
    text-shadow:3px 3px black;
}

</style>
</head>
<body>

<div id="hud">
GREEN HILL — CHRONO FRACTURE<br>
RINGS: <span id="rings">0</span>
</div>

<canvas id="game"></canvas>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

ctx.imageSmoothingEnabled = false;



// SPRITE

const idleSprite = new Image();
idleSprite.src = "idle.png";



// CAMERA

let cameraX = 0;



// RINGS

let rings = 0;



// GRAVITY

const gravity = 0.8;



// PLAYER

const player = {

    x:100,
    y:300,

    width:64,
    height:96,

    vx:0,
    vy:0,

    grounded:false
};



// INPUT

const keys = {};

document.addEventListener("keydown", e=>{

    keys[e.code] = true;

    if(e.code === "Space" && player.grounded){

        player.vy = -18;
    }
});

document.addEventListener("keyup", e=>{

    keys[e.code] = false;
});




// LEVEL

const level = [

    {x:0,y:550,w:1800,h:300},

    {x:2100,y:500,w:700,h:350},

    {x:3200,y:450,w:600,h:400},

    {x:4300,y:550,w:1800,h:300},

    {x:6700,y:450,w:500,h:30},

    {x:7400,y:350,w:500,h:30},

    {x:8200,y:550,w:2500,h:300},

    {x:11100,y:450,w:600,h:30},

    {x:12000,y:550,w:1600,h:300}
];




// RINGS

const ringList = [];

for(let i=300;i<13000;i+=150){

    ringList.push({

        x:i,
        y:350 + Math.sin(i*0.01)*80,

        collected:false
    });
}




// BACKGROUND

function drawBackground(){

    ctx.fillStyle = "#6ec6ff";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    // mountains
    ctx.fillStyle = "#4caf50";

    for(let i=0;i<30;i++){

        ctx.beginPath();

        ctx.arc(

            i*500 - cameraX*0.3,
            500,

            300,

            Math.PI,
            0
        );

        ctx.fill();
    }

    // water
    ctx.fillStyle = "#2b9cff";

    ctx.fillRect(
        0,
        canvas.height-120,
        canvas.width,
        120
    );
}




// GROUND

function drawGround(){

    level.forEach(g=>{

        // dirt
        ctx.fillStyle = "#9b5a2e";

        ctx.fillRect(

            g.x-cameraX,
            g.y,

            g.w,
            g.h
        );

        // grass
        ctx.fillStyle = "#3bc93b";

        ctx.fillRect(

            g.x-cameraX,
            g.y,

            g.w,
            25
        );

        // checker pattern
        ctx.strokeStyle = "#7a431f";

        for(let x=0;x<g.w;x+=40){

            for(let y=25;y<g.h;y+=40){

                ctx.strokeRect(

                    g.x-cameraX+x,
                    g.y+y,

                    40,
                    40
                );
            }
        }
    });
}




// PLAYER

function drawPlayer(){

    const screenX = player.x - cameraX;

    ctx.save();

    // flip left
    if(player.vx < 0){

        ctx.scale(-1,1);

        ctx.drawImage(

            idleSprite,

            -screenX - 64,
            player.y,

            64,
            96
        );
    }
    else{

        ctx.drawImage(

            idleSprite,

            screenX,
            player.y,

            64,
            96
        );
    }

    ctx.restore();
}




// RINGS

function drawRings(){

    ringList.forEach(r=>{

        if(!r.collected){

            ctx.strokeStyle = "gold";
            ctx.lineWidth = 5;

            ctx.beginPath();

            ctx.arc(

                r.x-cameraX,
                r.y,

                15,

                0,
                Math.PI*2
            );

            ctx.stroke();
        }
    });
}




// COLLECT RINGS

function collectRings(){

    ringList.forEach(r=>{

        if(!r.collected){

            let dx = r.x - player.x;
            let dy = r.y - player.y;

            let dist = Math.sqrt(dx*dx + dy*dy);

            if(dist < 60){

                r.collected = true;

                rings++;

                document.getElementById("rings").innerText = rings;
            }
        }
    });
}




// PHYSICS

function physics(){

    // movement
    if(keys["ArrowRight"]){

        player.vx += 0.7;
    }
    else if(keys["ArrowLeft"]){

        player.vx -= 0.7;
    }
    else{

        player.vx *= 0.90;
    }

    // speed cap
    if(player.vx > 14){
        player.vx = 14;
    }

    if(player.vx < -14){
        player.vx = -14;
    }

    player.x += player.vx;

    // gravity
    player.vy += gravity;

    player.y += player.vy;

    player.grounded = false;

    // collisions
    level.forEach(g=>{

        if(

            player.x + player.width > g.x &&
            player.x < g.x + g.w &&

            player.y + player.height > g.y &&
            player.y + player.height < g.y + 60
        ){

            player.y = g.y - player.height;

            player.vy = 0;

            player.grounded = true;
        }
    });

    // camera
    let targetCamera =

        player.x - canvas.width/2;

    cameraX +=

        (targetCamera-cameraX)*0.1;

    if(cameraX < 0){
        cameraX = 0;
    }

    // death
    if(player.y > canvas.height + 500){

        player.x = 100;
        player.y = 300;

        player.vx = 0;
        player.vy = 0;

        cameraX = 0;
    }
}




// LOOP

function loop(){

    drawBackground();

    drawGround();

    drawRings();

    collectRings();

    physics();

    drawPlayer();

    requestAnimationFrame(loop);
}

loop();

</script>

</body>
</html>
