```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Metal Sonic: Chrono Fix</title>

<style>
body{
    margin:0;
    overflow:hidden;
    background:black;
    font-family:Arial;
}

canvas{
    display:block;
    background:linear-gradient(#5cc8ff,#d9f7ff);
}

#hud{
    position:absolute;
    top:10px;
    left:15px;
    color:white;
    font-size:24px;
    text-shadow:2px 2px black;
}
</style>
</head>
<body>

<div id="hud">
    GREEN HILL — CHRONO FRACTURE<br>
    RINGS: <span id="rings">0</span>
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = innerWidth;
canvas.height = innerHeight;

const gravity = 0.8;

let cameraX = 0;
let ringCount = 0;

const player = {
    x:100,
    y:200,
    width:50,
    height:50,

    vx:0,
    vy:0,

    speed:0.7,
    maxSpeed:13,

    grounded:false
};

const keys = {};

document.addEventListener("keydown",e=>{

    keys[e.code] = true;

    if(e.code==="Space" && player.grounded){
        player.vy = -16;
    }
});

document.addEventListener("keyup",e=>{
    keys[e.code] = false;
});

const ground = [

    // terrain
    {x:0,y:550,w:700,h:300},
    {x:750,y:500,w:400,h:350},
    {x:1200,y:450,w:500,h:400},
    {x:1800,y:550,w:700,h:300},
    {x:2600,y:480,w:500,h:370},
    {x:3200,y:400,w:700,h:450},
    {x:4100,y:550,w:900,h:300},

    // floating platforms
    {x:900,y:320,w:150,h:30},
    {x:1100,y:250,w:150,h:30},
    {x:2100,y:350,w:180,h:30},
    {x:2350,y:280,w:180,h:30},
    {x:3500,y:260,w:200,h:30},
];

const rings = [];

for(let i=300;i<4700;i+=120){

    rings.push({
        x:i,
        y:300 + Math.sin(i*0.01)*80,
        collected:false
    });
}

const enemies = [
    {x:1400,y:390,w:40,h:40,dir:1},
    {x:2800,y:420,w:40,h:40,dir:1},
    {x:3700,y:340,w:40,h:40,dir:1},
];

const springs = [
    {x:1600,y:410,w:40,h:40},
    {x:3000,y:440,w:40,h:40},
];

let checkpoint = {
    x:100,
    y:200
};

function drawBackground(){

    // mountains
    ctx.fillStyle = "#4db06d";

    for(let i=0;i<15;i++){

        ctx.beginPath();
        ctx.arc(i*500 - cameraX*0.3,500,300,Math.PI,0);
        ctx.fill();
    }

    // water
    ctx.fillStyle = "#2ca8ff";
    ctx.fillRect(0,canvas.height-120,canvas.width,120);
}

function drawGround(){

    ground.forEach(g=>{

        ctx.fillStyle = "#3cb043";
        ctx.fillRect(g.x-cameraX,g.y,g.w,g.h);

        ctx.fillStyle = "#9b5a2e";
        ctx.fillRect(g.x-cameraX,g.y+25,g.w,g.h-25);

        ctx.strokeStyle = "#7a431f";

        for(let x=0;x<g.w;x+=40){
            for(let y=25;y<g.h;y+=40){

                ctx.strokeRect(
                    g.x-cameraX+x,
                    g.y+y,
                    40,
                    40
                );
            }
        }
    });
}

function drawPalmTrees(){

    for(let i=0;i<10;i++){

        let x = i*600 + 250 - cameraX*0.9;

        ctx.fillStyle = "#8b4513";
        ctx.fillRect(x,350,20,200);

        ctx.fillStyle = "green";

        for(let j=0;j<5;j++){

            ctx.beginPath();
            ctx.arc(x+10,340,50,0,Math.PI*2);
            ctx.fill();
        }
    }
}

function drawPlayer(){

    // draw relative to camera
    let screenX = player.x - cameraX;

    ctx.fillStyle = "#00d9ff";
    ctx.fillRect(screenX,player.y,player.width,player.height);

    ctx.fillStyle = "red";
    ctx.fillRect(screenX+8,player.y+15,34,8);

    ctx.fillStyle = "cyan";
    ctx.fillRect(screenX+18,player.y+48,14,10);
}

function drawRings(){

    rings.forEach(r=>{

        if(!r.collected){

            ctx.strokeStyle = "gold";
            ctx.lineWidth = 5;

            ctx.beginPath();
            ctx.arc(r.x-cameraX,r.y,15,0,Math.PI*2);
            ctx.stroke();
        }
    });
}

function collectRings(){

    rings.forEach(r=>{

        if(!r.collected){

            let dx = r.x - player.x;
            let dy = r.y - (player.y+25);

            let dist = Math.sqrt(dx*dx + dy*dy);

            if(dist < 40){

                r.collected = true;
                ringCount++;

                document.getElementById("rings").innerText = ringCount;
            }
        }
    });
}

function drawEnemies(){

    enemies.forEach(e=>{

        ctx.fillStyle = "purple";

        ctx.fillRect(
            e.x-cameraX,
            e.y,
            e.w,
            e.h
        );

        // movement
        e.x += e.dir * 2;

        if(Math.random() < 0.01){
            e.dir *= -1;
        }

        // collision
        if(
            player.x < e.x + e.w &&
            player.x + player.width > e.x &&
            player.y < e.y + e.h &&
            player.y + player.height > e.y
        ){
            respawn();
        }
    });
}

function drawSprings(){

    springs.forEach(s=>{

        ctx.fillStyle = "red";

        ctx.fillRect(
            s.x-cameraX,
            s.y,
            s.w,
            s.h
        );

        if(
            player.x < s.x + s.w &&
            player.x + player.width > s.x &&
            player.y < s.y + s.h &&
            player.y + player.height > s.y
        ){
            player.vy = -25;
        }
    });
}

function drawCheckpoint(){

    ctx.fillStyle = "yellow";

    ctx.fillRect(
        3900-cameraX,
        300,
        20,
        120
    );

    if(
        player.x < 3920 &&
        player.x + player.width > 3900 &&
        player.y < 420 &&
        player.y + player.height > 300
    ){
        checkpoint.x = 3900;
        checkpoint.y = 200;
    }
}

function respawn(){

    player.x = checkpoint.x;
    player.y = checkpoint.y;

    player.vx = 0;
    player.vy = 0;
}

function physics(){

    // movement
    if(keys["ArrowRight"]){
        player.vx += player.speed;
    }
    else if(keys["ArrowLeft"]){
        player.vx -= player.speed;
    }
    else{
        player.vx *= 0.90;
    }

    // speed clamp
    if(player.vx > player.maxSpeed){
        player.vx = player.maxSpeed;
    }

    if(player.vx < -player.maxSpeed){
        player.vx = -player.maxSpeed;
    }

    player.x += player.vx;

    // gravity
    player.vy += gravity;
    player.y += player.vy;

    player.grounded = false;

    // collisions
    ground.forEach(g=>{

        if(
            player.x + player.width > g.x &&
            player.x < g.x + g.w &&
            player.y + player.height > g.y &&
            player.y + player.height < g.y + 40
        ){
            player.y = g.y - player.height;

            player.vy = 0;
            player.grounded = true;
        }
    });

    // Sonic-style smooth camera
    let targetCamera = player.x - canvas.width / 2;

    cameraX += (targetCamera - cameraX) * 0.08;

    if(cameraX < 0){
        cameraX = 0;
    }

    // death boundary
    if(player.y > canvas.height + 300){
        respawn();
    }
}

function loop(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    drawBackground();
    drawGround();
    drawPalmTrees();

    drawRings();
    collectRings();

    drawEnemies();
    drawSprings();
    drawCheckpoint();

    physics();
    drawPlayer();

    requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
```
